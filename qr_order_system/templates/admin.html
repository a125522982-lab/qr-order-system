<!-- 請在後台適當位置（例如選單管理上方）加入以下優惠專區管理介面 -->
<div class="admin-section" style="background: #fff9db; border: 1px solid #fcc419; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
    <h3>🔥 新增優惠專區品項</h3>
    <form onsubmit="addPromoItem(event)" style="display: flex; gap: 10px; flex-wrap: wrap;">
        <input type="text" id="promo-name" placeholder="優惠名稱 (例如: 雙人炸雞特餐)" required style="padding: 8px; flex: 2; border: 1px solid #ccc; border-radius: 4px;">
        <input type="number" id="promo-price" placeholder="金額 ($)" required style="padding: 8px; flex: 1; border: 1px solid #ccc; border-radius: 4px;">
        <button type="submit" style="background: #f59f00; color: white; border: none; padding: 8px 16px; border-radius: 4px; font-weight: bold; cursor: pointer;">新增至優惠專區</button>
    </form>
    
    <div style="margin-top: 15px;">
        <b>現有優惠品項清單：</b>
        <ul id="promo-list" style="margin: 5px 0; padding-left: 20px;">
            {% for id, item in menu.items() %}
                {% if item.get('category') == 'promo' %}
                    <li style="margin-bottom: 5px;">
                        {{ item.name }} - ${{ item.price }} 
                        <button onclick="deletePromo('{{ id }}')" style="background: #d90429; color: white; border: none; padding: 2px 8px; border-radius: 4px; font-size: 12px; margin-left: 10px; cursor: pointer;">刪除</button>
                    </li>
                {% endif %}
            {% endfor %}
        </ul>
    </div>
</div>

<script>
    async function addPromoItem(event) {
        event.preventDefault();
        let name = document.getElementById('promo-name').value.trim();
        let price = document.getElementById('promo-price').value.trim();

        let res = await fetch('/api/promo/add', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, price })
        });
        let data = await res.json();
        if (data.success) {
            alert('優惠品項新增成功！');
            location.reload();
        } else {
            alert('新增失敗：' + data.message);
        }
    }

    async function deletePromo(itemId) {
        if (!confirm('確定要刪除這個優惠品項嗎？')) return;
        let res = await fetch('/api/promo/delete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ item_id: itemId })
        });
        let data = await res.json();
        if (data.success) {
            alert('已成功刪除');
            location.reload();
        } else {
            alert('刪除失敗：' + data.message);
        }
    }
</script>
