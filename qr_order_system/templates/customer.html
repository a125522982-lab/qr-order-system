<script>
    const hoursData = {{ hours | tojson }};
    
    function checkIsOpenNow() {
        if (hoursData && hoursData.force_close) return false;
        
        const now = new Date();
        const day = now.getDay();
        const currentMinutes = now.getHours() * 60 + now.getMinutes();

        if (day === 1 || day === 2) return false;

        let openMinutes = 11 * 60 + 30;
        let closeMinutes = 0;

        if (day === 3 || day === 4) closeMinutes = 19 * 60 + 30;
        else if (day === 5 || day === 6) closeMinutes = 21 * 60 + 30;
        else if (day === 0) closeMinutes = 20 * 60;

        return currentMinutes >= openMinutes && currentMinutes <= closeMinutes;
    }

    window.addEventListener('DOMContentLoaded', () => {
        const isOpen = checkIsOpenNow();
        if (!isOpen) {
            document.getElementById('closed-banner').style.display = 'block';
            document.getElementById('order-view').style.display = 'none';
        } else {
            document.getElementById('closed-banner').style.display = 'none';
            document.getElementById('order-view').style.display = 'block';
        }
    });

    let cart = [];
    const tableNumber = "{{ table }}";
    let currentOrderId = null;
    let statusInterval = null;
    let isCompletedAlertTriggered = false;
    const alertAudio = document.getElementById('customer-alert-sound');

    const allSidesList = [
        "米血", "薯餅", "甜不辣", "花枝丸", "洋蔥圈", "乳酪棒", "芋泥球", "起司球", 
        "杏鮑菇", "美式脆薯", "麥嗑雞塊", "起司薯球", "帶皮薯瓣", "椒鹽銀絲卷", 
        "煉乳銀絲卷", "煉香花月圓", "娘惹山藥捲", "深海鱈魚條", "黃金地瓜條"
    ];

    let currentModalItem = { id: '', name: '', price: 0, qty: 1, pepper: '要胡椒', spicy: '不辣', category: '', sauces: {}, sides: {} };

    document.addEventListener('click', () => {
        if (alertAudio.paused) { alertAudio.load(); }
    }, { once: true });

    function filterMenu(category, btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.menu-item').forEach(item => {
            if (category === 'all' || item.getAttribute('data-category') === category) {
                item.style.display = 'flex';
            } else {
                item.style.display = 'none';
            }
        });
    }

    function openOptionModal(id, name, price, category) {
        currentModalItem = { 
            id: id, name: name, price: price, qty: 1, pepper: '要胡椒', spicy: '不辣', category: category,
            sauces: { "番茄醬": 0, "起司醬": 0, "香菜檸檬醬": 0 }, sides: {}
        };
        allSidesList.forEach(side => { currentModalItem.sides[side] = 0; });
        
        document.getElementById('modal-item-name').innerText = name;
        document.getElementById('modal-item-price').innerText = '$' + price;
        document.getElementById('modal-qty').innerText = '1';

        let seasoningSec = document.getElementById('seasoning-section');
        let sauceSec = document.getElementById('sauce-section');
        let chickenSidesSec = document.getElementById('chicken-sides-section');
        let wholeChickenNotice = document.getElementById('whole-chicken-notice');

        let isOnlyQty = (category === 'drink' || category === 'promo' || name.includes('煉香花月圓') || name.includes('煉乳銀絲卷'));
        let isFriedWholeChicken = (name.includes('炸全雞'));
        let isChickenMeal = (name.includes('全雞餐'));

        if (isOnlyQty) {
            seasoningSec.style.display = 'none';
            sauceSec.style.display = 'none';
            chickenSidesSec.style.display = 'none';
        } else if (isFriedWholeChicken) {
            seasoningSec.style.display = 'none';
            sauceSec.style.display = 'block';
            wholeChickenNotice.style.display = 'block';
            chickenSidesSec.style.display = 'none';
            renderSaucesUI();
        } else if (isChickenMeal) {
            seasoningSec.style.display = 'block';
            sauceSec.style.display = 'block';
            wholeChickenNotice.style.display = 'none';
            chickenSidesSec.style.display = 'block';
            renderSaucesUI();
            renderSidesUI();
            resetOptionGroup('pepper-options', '要胡椒');
            resetOptionGroup('spicy-options', '不辣');
        } else {
            seasoningSec.style.display = 'block';
            sauceSec.style.display = 'none';
            chickenSidesSec.style.display = 'none';
            resetOptionGroup('pepper-options', '要胡椒');
            resetOptionGroup('spicy-options', '不辣');
        }

        updateModalSubtotal();
        document.getElementById('option-modal').style.display = 'flex';
    }

    function getTotalSauces() {
        let sum = 0;
        for (let s in currentModalItem.sauces) { sum += currentModalItem.sauces[s]; }
        return sum;
    }

    function getTotalSides() {
        let sum = 0;
        for (let s in currentModalItem.sides) { sum += currentModalItem.sides[s]; }
        return sum;
    }

    function renderSaucesUI() {
        let total = getTotalSauces();
        document.getElementById('sauce-count').innerText = total;
        for (let sauce in currentModalItem.sauces) {
            let el = document.getElementById(`sauce_${sauce}`);
            if (el) el.innerText = currentModalItem.sauces[sauce];
        }
    }

    function renderSidesUI() {
        let total = getTotalSides();
        document.getElementById('side-count').innerText = total;
        let container = document.getElementById('sides-list-container');
        let html = '';
        allSidesList.forEach(side => {
            let count = currentModalItem.sides[side] || 0;
            html += `
                <div class="sub-item-row">
                    <span class="sub-item-name">${side}</span>
                    <div class="sub-controls">
                        <button class="sub-btn" onclick="changeSubQty('side', '${side}', -1)">-</button>
                        <span id="side_${side}" style="font-weight: bold; width: 20px; text-align: center;">${count}</span>
                        <button class="sub-btn" onclick="changeSubQty('side', '${side}', 1)">+</button>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    function changeSubQty(type, key, delta) {
        if (type === 'sauce') {
            let currentTotal = getTotalSauces();
            if (delta > 0 && currentTotal >= 2) { alert('醬料總共只能選擇 2 份！'); return; }
            currentModalItem.sauces[key] += delta;
            if (currentModalItem.sauces[key] < 0) currentModalItem.sauces[key] = 0;
            renderSaucesUI();
        } else if (type === 'side') {
            let currentTotal = getTotalSides();
            if (delta > 0 && currentTotal >= 3) { alert('附餐總共只能選擇 3 份！'); return; }
            currentModalItem.sides[key] += delta;
            if (currentModalItem.sides[key] < 0) currentModalItem.sides[key] = 0;
            renderSidesUI();
        }
    }

    function closeOptionModal() { document.getElementById('option-modal').style.display = 'none'; }
    function resetOptionGroup(groupId, defaultValue) {
        document.querySelectorAll(`#${groupId} .option-btn`).forEach(b => {
            if (b.innerText === defaultValue) b.classList.add('selected');
            else b.classList.remove('selected');
        });
    }
    function selectOption(type, value, btnEl) {
        btnEl.parentElement.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
        btnEl.classList.add('selected');
        if (type === 'pepper') currentModalItem.pepper = value;
        if (type === 'spicy') currentModalItem.spicy = value;
    }
    function changeModalQty(delta) {
        currentModalItem.qty += delta;
        if (currentModalItem.qty < 1) currentModalItem.qty = 1;
        document.getElementById('modal-qty').innerText = currentModalItem.qty;
        updateModalSubtotal();
    }
    function updateModalSubtotal() { document.getElementById('modal-subtotal').innerText = currentModalItem.price * currentModalItem.qty; }

    function confirmAddToCart() {
        let specText = "";
        let isOnlyQty = (currentModalItem.category === 'drink' || currentModalItem.category === 'promo' || currentModalItem.name.includes('煉香花月圓') || currentModalItem.name.includes('煉乳銀絲卷'));
        let isFriedWholeChicken = (currentModalItem.name.includes('炸全雞'));
        let isChickenMeal = (currentModalItem.name.includes('全雞餐'));

        if (isOnlyQty) {
            specText = "標準";
        } else if (isFriedWholeChicken) {
            if (getTotalSauces() !== 2) { alert('【炸全雞】醬料總共必須剛好選擇 2 份！'); return; }
            let sauceSummary = [];
            for (let sauce in currentModalItem.sauces) {
                if (currentModalItem.sauces[sauce] > 0) sauceSummary.push(`${sauce}x${currentModalItem.sauces[sauce]}`);
            }
            specText = `醬料: ${sauceSummary.join(', ')} | 胡椒、辣椒另外附`;
        } else if (isChickenMeal) {
            if (getTotalSauces() !== 2) { alert('【全雞餐】醬料總共必須剛好選擇 2 份！'); return; }
            if (getTotalSides() !== 3) { alert('【全雞餐】附餐總共必須剛好選擇 3 份！'); return; }
            let sauceSummary = [], sideSummary = [];
            for (let sauce in currentModalItem.sauces) {
                if (currentModalItem.sauces[sauce] > 0) sauceSummary.push(`${sauce}x${currentModalItem.sauces[sauce]}`);
            }
            for (let side in currentModalItem.sides) {
                if (currentModalItem.sides[side] > 0) sideSummary.push(`${side}x${currentModalItem.sides[side]}`);
            }
            specText = `${currentModalItem.pepper}/${currentModalItem.spicy} | 醬料: ${sauceSummary.join(', ')} | 附餐: ${sideSummary.join(', ')}`;
        } else {
            specText = `${currentModalItem.pepper}/${currentModalItem.spicy}`;
        }

        let cartKey = `${currentModalItem.id}_${specText}`;
        let existingItem = cart.find(item => item.cartKey === cartKey);
        if (existingItem) {
            existingItem.quantity += currentModalItem.qty;
        } else {
            cart.push({ cartKey: cartKey, name: currentModalItem.name, price: currentModalItem.price, quantity: currentModalItem.qty, spec: specText });
        }
        updateCartUI();
        closeOptionModal();
    }

    function changeQty(cartKey, delta) {
        let item = cart.find(item => item.cartKey === cartKey);
        if (item) {
            item.quantity += delta;
            if (item.quantity <= 0) cart = cart.filter(i => i.cartKey !== cartKey);
        }
        updateCartUI();
    }

    function updateCartUI() {
        let cartBody = document.getElementById('cart-body');
        let totalAmountEl = document.getElementById('total-amount');
        if (cart.length === 0) {
            cartBody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #777; padding: 20px;">購物車目前是空的</td></tr>';
            totalAmountEl.innerText = '0';
            return;
        }
        let html = '', total = 0;
        cart.forEach(item => {
            let subtotal = item.price * item.quantity;
            total += subtotal;
            let tagDisplay = item.spec === "Standard" ? "" : `<div class="item-spec-tag">📝 ${item.spec}</div>`;
            html += `
                <tr>
                    <td><div style="font-weight: bold; color: #222;">${item.name}</div>${tagDisplay}</td>
                    <td>$${item.price}</td>
                    <td>
                        <button onclick="changeQty('${item.cartKey}', -1)" style="padding: 2px 8px; background: #6c757d;">-</button>
                        <span style="margin: 0 6px; font-weight: bold;">${item.quantity}</span>
                        <button onclick="changeQty('${item.cartKey}', 1)" style="padding: 2px 8px; background: #6c757d;">+</button>
                    </td>
                    <td style="font-weight: bold; color: #e63946;">$${subtotal}</td>
                    <td><button onclick="changeQty('${item.cartKey}', -${item.quantity})" style="background: #d90429; padding: 4px 8px; font-size: 12px;">刪除</button></td>
                </tr>
            `;
        });
        cartBody.innerHTML = html;
        totalAmountEl.innerText = total;
    }

    function promptCheckout() {
        if (cart.length === 0) { alert('購物車是空的，請先選擇餐點！'); return; }
        let phone = prompt('請輸入您的【完整 10 碼電話號碼】（後四碼將作為取餐編號）：');
        if (phone === null) return;
        phone = phone.trim();
        if (phone.length !== 10 || isNaN(phone)) { alert('格式錯誤！請務必輸入正確的 10 位數字電話號碼。'); return; }
        submitOrder(phone);
    }

    function submitOrder(phone) {
        let total = parseInt(document.getElementById('total-amount').innerText) || 0;
        let formattedItems = cart.map(item => ({ name: `${item.name} (${item.spec})`, price: Number(item.price), quantity: Number(item.quantity) }));
        let orderData = { table: String(tableNumber), phone: String(phone), items: formattedItems, total: Number(total) };

        fetch('/api/order', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(orderData) })
        .then(res => res.json())
        .then(data => {
            if (data.success) { loadTrackerView(data.order_id); }
            else { alert('送出失敗：' + (data.message || '未知錯誤')); }
        });
    }

    async function loadTrackerView(orderId) {
        currentOrderId = orderId;
        isCompletedAlertTriggered = false;
        try {
            let res = await fetch(`/api/order/status?order_id=${orderId}`);
            let data = await res.json();
            if (data.success) {
                let order = data.order;
                document.getElementById('order-view').style.display = 'none';
                document.getElementById('history-view').style.display = 'none';
                document.getElementById('tracker-view').style.display = 'block';

                document.getElementById('acknowledge-btn').style.display = 'none';
                document.getElementById('finish-order-btn').style.display = 'none';

                document.getElementById('track-phone').innerText = order.phone_last4;
                document.getElementById('track-total').innerText = order.total;
                
                let itemsHtml = '';
                order.food_list.forEach(i => { itemsHtml += `<li><b>${i.name}</b> x ${i.quantity} ($${i.price * i.quantity})</li>`; });
                document.getElementById('track-items').innerHTML = itemsHtml;
                startStatusPolling();
            }
        } catch (e) { alert('找不到該訂單'); }
    }

    async function searchMyOrder() {
        let phone4 = document.getElementById('search-phone4').value.trim();
        if (phone4.length !== 4 || isNaN(phone4)) { alert('請輸入正確的電話後 4 碼！'); return; }
        try {
            let res = await fetch(`/api/order/status?phone_last4=${phone4}`);
            let data = await res.json();
            if (data.success) {
                let ongoingOrder = (data.orders || []).find(o => o.status === 'pending' || o.status === 'accepted' || o.status === 'ready' || o.status === 'acknowledged');
                if (ongoingOrder) {
                    loadTrackerView(ongoingOrder.id);
                } else {
                    renderHistoryList(data.orders || [data.order], phone4);
                }
            } else { alert('找不到該末四碼對應的訂單紀錄'); }
        } catch (e) { alert('查詢發生錯誤'); }
    }

    function renderHistoryList(ordersList, phone4) {
        document.getElementById('order-view').style.display = 'none';
        document.getElementById('tracker-view').style.display = 'none';
        document.getElementById('history-view').style.display = 'block';
        document.getElementById('history-phone4').innerText = phone4;

        let container = document.getElementById('history-list-container');
        let html = '';
        ordersList.forEach(order => {
            let itemsHtml = '';
            (order.food_list || []).forEach(i => {
                itemsHtml += `<li>${i.name} x ${i.quantity}</li>`;
            });
            html += `
                <div class="history-card">
                    <div style="font-size: 13px; color: #6c757d; margin-bottom: 4px;">下單時間：${order.created_at || '無紀錄'}</div>
                    <div style="font-size: 14px; font-weight: bold; margin-bottom: 6px;">餐點明細：</div>
                    <ul style="padding-left: 20px; margin: 0 0 8px 0; font-size: 14px;">${itemsHtml}</ul>
                    <div style="text-align: right; font-weight: bold; color: #e63946;">總金額：$${order.total}</div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    function backToMenuOnly() {
        document.getElementById('history-view').style.display = 'none';
        document.getElementById('tracker-view').style.display = 'none';
        document.getElementById('order-view').style.display = 'block';
    }

    // 儲存目前拉取到的訂單狀態，避免輪詢重置畫面
    let lastKnownStatus = '';

    function startStatusPolling() {
        if (statusInterval) clearInterval(statusInterval);
        statusInterval = setInterval(async () => {
            if (!currentOrderId) return;
            try {
                let res = await fetch(`/api/order/status?order_id=${currentOrderId}`);
                let data = await res.json();
                if (data.success) {
                    let order = data.order;
                    let statusText = document.getElementById('track-status');
                    let ackBtn = document.getElementById('acknowledge-btn');
                    let finishBtn = document.getElementById('finish-order-btn');
                    let cancelBtn = document.getElementById('cancel-order-btn');

                    // 如果後台狀態有變，或者第一次載入，才更新按鈕顯示狀態
                    if (order.status !== lastKnownStatus) {
                        lastKnownStatus = order.status;

                        if (order.status === 'pending') {
                            statusText.innerText = "等待店家接受訂單...";
                            cancelBtn.style.display = 'block';
                            ackBtn.style.display = 'none';
                            finishBtn.style.display = 'none';
                        } else if (order.status === 'accepted') {
                            statusText.innerText = "店家已接單，正在準備餐點中...";
                            cancelBtn.style.display = 'none';
                            ackBtn.style.display = 'none';
                            finishBtn.style.display = 'none';
                        } else if (order.status === 'ready') {
                            statusText.innerText = "餐點已製作完成！請前往取餐";
                            cancelBtn.style.display = 'none';
                            ackBtn.style.display = 'block'; // 顯示「了解，過去取餐」
                            finishBtn.style.display = 'none';
                            if (!isCompletedAlertTriggered) {
                                alertAudio.play().catch(e => console.log('音效播放受阻:', e));
                                isCompletedAlertTriggered = true;
                            }
                        } else if (order.status === 'acknowledged') {
                            statusText.innerText = "已知悉，正在前往取餐路上...";
                            cancelBtn.style.display = 'none';
                            ackBtn.style.display = 'none';
                            finishBtn.style.display = 'block'; // 顯示「取餐完成 (返回點餐)」
                        } else if (order.status === 'completed') {
                            clearInterval(statusInterval);
                            alertAudio.pause();
                            alertAudio.currentTime = 0;
                            document.getElementById('tracker-view').style.display = 'none';
                            document.getElementById('order-view').style.display = 'block';
                            alert('感謝您的光臨！');
                        }
                    }
                }
            } catch (e) { console.error(e); }
        }, 3000);
    }

    async function acknowledgeOrder() {
        if (!currentOrderId) return;
        // 立即在前端切換畫面狀態，避免等待 3 秒輪詢造成按鈕點擊失效
        lastKnownStatus = 'acknowledged';
        document.getElementById('track-status').innerText = "已知悉，正在前往取餐路上...";
        document.getElementById('acknowledge-btn').style.display = 'none';
        document.getElementById('finish-order-btn').style.display = 'block';

        await fetch(`/api/order/acknowledge`, { 
            method: 'POST', 
            headers: { 'Content-Type': 'application/json' }, 
            body: JSON.stringify({ order_id: currentOrderId }) 
        });
    }

    async function finishOrder() {
        if (!currentOrderId) return;
        alertAudio.pause();
        alertAudio.currentTime = 0;
        await fetch(`/api/order/complete`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ order_id: currentOrderId }) });
        
        document.getElementById('tracker-view').style.display = 'none';
        document.getElementById('order-view').style.display = 'block';
        currentOrderId = null;
        lastKnownStatus = '';
    }

    async function cancelMyOrder() {
        if (!currentOrderId) return;
        if (!confirm('確定要取消這筆訂單嗎？')) return;
        let res = await fetch(`/api/order/cancel`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ order_id: currentOrderId }) });
        let data = await res.json();
        if (data.success) {
            alert('訂單已取消');
            location.reload();
        } else {
            alert('取消失敗：' + (data.message || '未知原因'));
        }
    }
</script>
