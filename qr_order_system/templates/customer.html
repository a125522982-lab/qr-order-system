<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>酷嗑斯美式炸雞 - 線上點餐系統</title>
    <!-- 引入 Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 引入 Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

    <!-- 導覽列 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                <i class="bi bi-fire text-danger me-2"></i>酷嗑斯美式炸雞
            </a>
            <div class="d-flex align-items-center">
                <span id="store-status" class="me-3"></span>
                <button class="btn btn-outline-light btn-sm" data-bs-toggle="modal" data-bs-target="#historyModal">
                    <i class="bi bi-clock-history me-1"></i>歷史訂單
                </button>
            </div>
        </div>
    </nav>

    <!-- 主要內容區 -->
    <div class="container my-4">
        
        <!-- 【新增】店家資訊卡片區塊 -->
        <div class="card shadow-sm border-0 rounded-4 mb-4">
            <div class="card-body p-4">
                <div class="d-flex flex-wrap align-items-center justify-content-between mb-3">
                    <h4 class="card-title text-danger fw-bold mb-0">
                        <i class="bi bi-shop me-2"></i>酷嗑斯美式炸雞
                    </h4>
                    <!-- 狀態顯示位置 -->
                    <div id="status-badge-container"></div>
                </div>
                <div class="row g-3 text-secondary">
                    <!-- 地址 -->
                    <div class="col-md-4">
                        <div class="d-flex align-items-start">
                            <i class="bi bi-geo-alt-fill text-danger fs-5 me-2 mt-1"></i>
                            <div>
                                <strong class="text-dark">店家地址</strong>
                                <p class="mb-0">台北市大同區某某路一段 88 號</p>
                            </div>
                        </div>
                    </div>
                    <!-- 電話 -->
                    <div class="col-md-4">
                        <div class="d-flex align-items-start">
                            <i class="bi bi-telephone-fill text-danger fs-5 me-2 mt-1"></i>
                            <div>
                                <strong class="text-dark">聯絡電話</strong>
                                <p class="mb-0">
                                    <a href="tel:0225551234" class="text-decoration-none text-secondary">(02) 2555-1234</a>
                                </p>
                            </div>
                        </div>
                    </div>
                    <!-- 營業時間 -->
                    <div class="col-md-4">
                        <div class="d-flex align-items-start">
                            <i class="bi bi-clock-fill text-danger fs-5 me-2 mt-1"></i>
                            <div>
                                <strong class="text-dark">營業時間</strong>
                                <p class="mb-0">週二至週日 11:30 - 21:00<br><small class="text-muted">（每週一公休）</small></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 點餐選單與購物車區塊（維持您原有的設計） -->
        <div class="row">
            <div class="col-lg-8 mb-4">
                <div class="card shadow-sm border-0 rounded-4 p-4">
                    <h3 class="fw-bold mb-3">美味菜單</h3>
                    <!-- 這裡放置您的菜單品項迴圈 -->
                    <p class="text-muted">（此處維持您原本的點餐選單邏輯）</p>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="card shadow-sm border-0 rounded-4 p-4">
                    <h3 class="fw-bold mb-3">您的餐點</h3>
                    <!-- 這裡放置您的購物車與送出訂單按鈕 -->
                    <p class="text-muted">（此處維持您原本的購物車邏輯）</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 歷史訂單 Modal（保留您原本的歷史訂單只顯示餐點與下單時間功能） -->
    <div class="modal fade" id="historyModal" tabindex="-1" aria-labelledby="historyModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content rounded-4">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="historyModalLabel"><i class="bi bi-clock-history me-2"></i>歷史訂單查詢</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="history-orders-list">
                        <!-- 動態載入歷史訂單（僅顯示餐點與下單時間） -->
                        <p class="text-muted text-center">載入中...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 引入 Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- 【新增】自動依據台灣時間 (UTC+8) 判斷營業狀態的 JavaScript -->
    <script>
    function updateStoreStatus() {
        const now = new Date();
        // 強制轉換計算為台灣時間 (UTC+8)
        const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
        const twTime = new Date(utc + (3600000 * 8));
        
        const day = twTime.getDay(); // 0: 週日, 1: 週一, ... 6: 週六
        const hour = twTime.getHours();
        const minute = twTime.getMinutes();
        const currentTime = hour + (minute / 60);

        let isOpen = true;
        // 營業時間定義：週一公休，其餘營業時間 11:30 (11.5) ~ 21:00 (21.0)
        if (day === 1) {
            isOpen = false;
        } else if (currentTime < 11.5 || currentTime >= 21.0) {
            isOpen = false;
        }

        const badgeHtml = isOpen 
            ? '<span class="badge bg-success fs-6 px-3 py-2"><i class="bi bi-check-circle-fill me-1"></i>營業中</span>' 
            : '<span class="badge bg-secondary fs-6 px-3 py-2"><i class="bi bi-moon-fill me-1"></i>休息中</span>';

        // 分別填入導覽列與卡片標題旁
        const navStatus = document.getElementById('store-status');
        const badgeContainer = document.getElementById('status-badge-container');
        
        if (navStatus) navStatus.innerHTML = badgeHtml;
        if (badgeContainer) badgeContainer.innerHTML = badgeHtml;
    }

    // 頁面載入時執行，並每分鐘自動更新一次
    document.addEventListener('DOMContentLoaded', () => {
        updateStoreStatus();
        setInterval(updateStoreStatus, 60000);
    });
    </script>
</body>
</html>
