<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>酷嗑斯美式炸雞 - 店家後台登入</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            padding: 20px; 
            background: #f4f6f8; 
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-card { 
            background: white; 
            padding: 30px 24px; 
            border-radius: 16px; 
            box-shadow: 0 4px 16px rgba(0,0,0,0.08); 
            width: 100%; 
            max-width: 380px; 
            text-align: center;
        }
        .logo-icon { font-size: 40px; margin-bottom: 10px; }
        h1 { font-size: 20px; color: #111; margin-top: 0; margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; text-align: left; }
        label { font-size: 14px; font-weight: bold; color: #495057; display: block; margin-bottom: 6px; }
        input[type="text"], input[type="password"] { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #ced4da; 
            border-radius: 8px; 
            font-size: 15px; 
            outline: none;
        }
        input[type="text"]:focus, input[type="password"]:focus {
            border-color: #2b9348;
            box-shadow: 0 0 0 3px rgba(43, 147, 72, 0.15);
        }
        .login-btn { 
            width: 100%; 
            padding: 14px; 
            background: #2b9348; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 10px;
        }
        .error-msg { 
            background: #f8d7da; 
            color: #721c24; 
            border: 1px solid #f5c6cb; 
            padding: 10px; 
            border-radius: 8px; 
            font-size: 14px; 
            margin-bottom: 16px; 
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-icon">🍗</div>
        <h1>酷嗑斯商家後台登入</h1>
        
        {% if error %}
            <div class="error-msg">⚠️ {{ error }}</div>
        {% endif %}

        <form action="/login" method="POST">
            <div class="form-group">
                <label for="username">帳號</label>
                <input type="text" id="username" name="username" placeholder="請輸入帳號" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">密碼</label>
                <input type="password" id="password" name="password" placeholder="請輸入密碼" required>
            </div>
            <button type="submit" class="login-btn">登入後台</button>
        </form>
    </div>
</body>
</html>
